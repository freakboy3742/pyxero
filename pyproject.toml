[build-system]
requires = [
    "setuptools==84.0.0",
    "setuptools_scm==10.2.1",
]
build-backend = "setuptools.build_meta"

[project]
dynamic = ["version"]
name = "pyxero"
description = "Python API for accessing the REST API of the Xero accounting tool."
readme = "README.md"
requires-python = ">= 3.10"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
authors = [
    {name="Russell Keith-Magee", email = "russell@keith-magee.com"},
]
maintainers = [
    {name="Russell Keith-Magee", email = "russell@keith-magee.com"},
]
keywords = [
    "xero",
    "api",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Intended Audience :: Financial and Insurance Industry",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Office/Business :: Financial :: Accounting",
]
dependencies = [
    "requests >= 1.1.0, < 3",
    "requests-oauthlib >= 0.3.0, < 3",
    "python-dateutil>=2.8, < 3",
    "PyJWT >= 1.6.4, < 3",  # This is required as part of oauthlib but doesn't seem to get included sometimes.
    "cryptography>=1.3.1",  # As above, but fixes issue with missing module imports not picked up for some reason.
]

[dependency-groups]
# Extras used by developers *of* briefcase are pinned to specific versions to
# ensure environment consistency.
pre-commit = [
    "pre-commit == 4.6.2",
]
test = [
    "pytest == 9.1.1",
]
ci = [
    "setuptools_scm == 10.2.1",
    "tox-uv == 1.36.0",
]
dev = [
    {include-group = "pre-commit"},
    {include-group = "test"},
    {include-group = "ci"},
]

[project.urls]
Homepage = "https://github.com/freakboy3742/pyxero"
Tracker = "https://github.com/freakboy3742/pyxero/issues"
Source = "https://github.com/freakboy3742/pyxero"

[tool.setuptools_scm]
# We're not doing anything Python-related at the root level of the repo, but if this
# declaration isn't here, tox commands run from the root directory raise a warning that
# pyproject.toml doesn't contain a setuptools_scm section.

[tool.pytest.ini_options]
testpaths = "tests"

[tool.ruff.lint]
# In addition to the default rules, these additional rules will be used:
extend-select = [
    "E",      # pycodestyle
    "W",      # pycodestyle
    "F",      # pyflakes
    "UP",     # pyupgrade
    "B",      # flake8-bugbear
    "YTT",    # flake8-2020
    "ASYNC",  # flake8-async
    "C4",     # flake8-comprehensions
    "I",      # isort
    # The SIM rules are *very* opinionated, and don't necessarily make for better code.
    # They may be worth occasionally turning on just to see if something could actually
    # use improvement.
    # "SIM",    # flake8-simplify
]

[tool.ruff.lint.per-file-ignores]
# Ignores needed to pass the Ruff 0.16 update.
"examples/receipts_importer/receipts.py" = ["EXE001", "SIM115"]
"src/xero/auth.py" = ["BLE001", "DTZ003", "DTZ004", "DTZ005"]
"src/xero/basemanager.py" = ["RUF012"]
"src/xero/exceptions.py" = ["PLE0101"]
"src/xero/filesmanager.py" = ["SIM115"]
"src/xero/utils.py" = ["DTZ001", "DTZ004"]
"tests/test_auth.py" = ["DTZ001", "DTZ005", "PLR1704", "S110"]
"tests/test_exceptions.py" = ["BLE001"]
"tests/test_manager.py" = ["DTZ001", "RUF059"]
"tests/test_utils.py" = ["DTZ001"]

# [tool.ruff.lint.isort]
# known-first-party = []

[tool.rumdl]
flavor = "mkdocs"
include = ["**/*.md"]
exclude = ["comment.md", "CODE_OF_CONDUCT.md", "docs-redirect/en/README.md", ".github/ISSUE_TEMPLATE/showcase-your-app.md"]
respect-gitignore = true

# Disable rules:
# MD014: Forces commands in codeblocks to show output
# MD033: No inline HTML
disable = ["MD014", "MD033",]

[tool.rumdl.per-file-ignores]
"docs/en/about/team/*.md" = ["MD041"]

[tool.rumdl.MD013]  # Line length
line_length = 999999
reflow = true
reflow_mode = "normalize"

[tool.rumdl.MD026]  # Remove punctuation at the end of headings
punctuation = ",;:"

[tool.rumdl.MD061]  # Fail on certain strings.
terms = ["TODO"]
